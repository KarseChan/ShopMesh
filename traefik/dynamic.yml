# Traefik v3 dynamic configuration
# Fine-grained routing: Java (Auth/CRUD) vs Python (Agent)

http:
  routers:
    # Java routes: Auth, API Keys, Users, Merchants, Products, JWKS, Health
    java-api:
      rule: "PathPrefix(`/api/auth`) || PathPrefix(`/api/users`) || PathPrefix(`/api/merchants`) || PathPrefix(`/api/products`) || Path(`/.well-known/jwks.json`)"
      entryPoints:
        - web
      service: java-service
      middlewares:
        - gateway-ratelimit
        - security-headers

    # Python routes: Chat, Conversations, Behavior, Tasks
    python-agent:
      rule: "PathPrefix(`/api/chat`) || PathPrefix(`/api/conversations`) || PathPrefix(`/api/behavior`) || PathPrefix(`/api/tasks`)"
      entryPoints:
        - web
      service: python-service
      middlewares:
        - gateway-ratelimit
        - security-headers

  services:
    java-service:
      loadBalancer:
        servers:
          - url: "http://java-api:8080"

    python-service:
      loadBalancer:
        servers:
          - url: "http://python-agent:9000"

  middlewares:
    # Rate limit at the gateway level (in-memory, per-Traefik instance)
    gateway-ratelimit:
      rateLimit:
        average: 500
        burst: 1000
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Security headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
