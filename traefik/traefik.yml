# Traefik v3 static configuration
# See: https://doc.traefik.io/traefik/

api:
  dashboard: true
  insecure: true  # dashboard on :8080 without auth (dev only)

entryPoints:
  web:
    address: ":80"
  # websecure:
  #   address: ":443"

providers:
  # File-based routing (fine-grained control: Java vs Python paths)
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

accessLog:
  bufferingSize: 100
