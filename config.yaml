# LLM
llm:
  default:
    provider: openai_compatible
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ${LLM_API_KEY}
    temperature: 0.1
    max_tokens: 2048

# Embedding
embedding:
  default:
    provider: ollama
    model: bge-m3
    base_url: http://localhost:11505
    dimensions: 1024

# Vector DB
vector_db:
  provider: qdrant
  url: http://localhost:6333
  collection: products

# Redis
redis:
  url: redis://localhost:6379

# Database
database:
  url: postgresql://postgres:password@localhost:5432/shopping_agent

# Router
router:
  routes:
    search: search_agent
    compare: compare_agent
    recommend: recommend_agent
    detail: detail_agent
    order: order_agent
  fallback: general_agent
  semantic_threshold: 0.80

# Memory
memory:
  context_window: 8192
  compression_threshold: 0.6
  sliding_window_rounds: 5
  summary_max_words: 200
  recall_top_k: 5

# Logging
logging:
  level: INFO
  format: json
  file_path: logs/app.jsonl
  rotation: daily
