# LLM
llm:
  default:
    provider: ollama
    model: qwen2.5:7b
    base_url: http://localhost:11434/v1
    temperature: 0.1
    max_tokens: 2048

# Embedding
embedding:
  default:
    provider: sentence_transformers
    model: BAAI/bge-m3
    device: cpu
    dimensions: 768

# Vector DB
vector_db:
  provider: qdrant
  url: http://localhost:6333
  collection: products

# Redis
redis:
  url: redis://localhost:6379

# Database
database:
  url: postgresql://postgres:password@localhost:5432/shopping_agent

# Logging
logging:
  level: INFO
  format: json
  file_path: logs/app.jsonl
  rotation: daily
