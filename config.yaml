# LLM
llm:
  default:
    provider: openai_compatible
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ${LLM_API_KEY}
    temperature: 0.1
    max_tokens: 2048

# Embedding
embedding:
  default:
    provider: ollama
    model: bge-m3
    base_url: http://localhost:11505
    dimensions: 1024

# Vector DB
vector_db:
  provider: qdrant
  url: http://localhost:6333
  collection: products

# Redis
redis:
  url: redis://localhost:6379

# Database
database:
  url: postgresql://postgres:password@localhost:5432/shopping_agent

# Router
router:
  routes:
    search: search_agent
    compare: compare_agent
    recommend: recommend_agent
    detail: detail_agent
    order: order_agent
  fallback: general_agent
  semantic_threshold: 0.80

# Multi-Agent configs
agents:
  recommend_agent:
    max_iterations: 5
    response_type: recommendation_cards
    tools: [product_search, multi_query_search, ask_clarification, constraint_relaxation, review_summary]
  search_agent:
    max_iterations: 4
    response_type: product_grid
    tools: [product_search, constraint_relaxation, ask_clarification]
  detail_agent:
    max_iterations: 5
    response_type: detail_card
    tools: [product_search, product_detail_batch, review_summary]
  compare_agent:
    max_iterations: 6
    response_type: comparison_table
    tools: [product_search, product_detail_batch, price_compare, review_summary]
  order_agent:
    max_iterations: 1
    response_type: order_confirmation
    tools: []

# Memory
memory:
  context_window: 8192
  compression_threshold: 0.6
  sliding_window_rounds: 5
  summary_max_words: 200
  recall_top_k: 5

# Logging
logging:
  level: INFO
  format: json
  file_path: logs/app.jsonl
  rotation: daily
