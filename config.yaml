# LLM
llm:
  default:
    provider: openai_compatible
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ${LLM_API_KEY}
    temperature: 0.1
    max_tokens: 2048
  orchestrator:
    provider: openai_compatible
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ${LLM_API_KEY}
    temperature: 0.0
    max_tokens: 1024

# Embedding
embedding:
  default:
    provider: ollama
    model: bge-m3
    base_url: http://localhost:11505
    dimensions: 1024

# Vector DB
vector_db:
  provider: qdrant
  url: ${QDRANT_URL:-http://localhost:6333}
  collection: products

# Redis
redis:
  url: ${REDIS_URL:-redis://localhost:6379}

# Database
database:
  url: ${DATABASE_URL:-postgresql://postgres:password@localhost:5432/shopping_agent}

# Router
router:
  routes:
    search: search_recommend_agent
    compare: detail_compare_agent
    recommend: search_recommend_agent
    detail: detail_compare_agent
  fallback: search_recommend_agent
  semantic_threshold: 0.80

# Multi-Agent configs
agents:
  search_recommend_agent:
    max_iterations: 5
    response_type: recommendation_cards
    tools: [product_search, multi_query_search, ask_clarification, constraint_relaxation, review_summary]
  detail_compare_agent:
    max_iterations: 6
    response_type: comparison_table
    tools: [product_search, product_detail_batch, price_compare, review_summary]

# Memory
memory:
  context_window: 8192
  compression_threshold: 0.6
  sliding_window_rounds: 5
  summary_max_words: 200
  recall_top_k: 5

# Celery (task queue)
celery:
  broker_url: ${CELERY_BROKER_URL:-amqp://guest:guest@localhost:5672//}
  result_backend: ${CELERY_RESULT_BACKEND:-}

# Auth (JWT)
auth:
  secret_key: ${JWT_SECRET_KEY}
  algorithm: HS256
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# Logging
logging:
  level: INFO
  format: json
  file_path: logs/app.jsonl
  rotation: daily
