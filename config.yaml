# LLM
llm:
  default:
    provider: openai_compatible
    model: astron-code-latest
    base_url: https://maas-coding-api.cn-huabei-1.xf-yun.com/v2
    api_key: ${LLM_API_KEY}
    temperature: 0.1
    max_tokens: 2048

# Embedding
embedding:
  default:
    provider: ollama
    model: bge-m3
    base_url: http://localhost:11505
    dimensions: 1024

# Vector DB
vector_db:
  provider: qdrant
  url: http://localhost:6333
  collection: products

# Redis
redis:
  url: redis://localhost:6379

# Database
database:
  url: postgresql://postgres:password@localhost:5432/shopping_agent

# Logging
logging:
  level: INFO
  format: json
  file_path: logs/app.jsonl
  rotation: daily
