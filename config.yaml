# LLM
llm:
  default:
    provider: openai_compatible
    model: ${LLM_MODEL:-deepseek-v4-flash}
    base_url: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
    api_key: ${LLM_API_KEY}
    temperature: 0.1
    max_tokens: 2048
  orchestrator:
    provider: openai_compatible
    model: ${LLM_MODEL:-deepseek-v4-flash}
    base_url: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
    api_key: ${LLM_API_KEY}
    temperature: 0.0
    max_tokens: 1024

# Embedding
embedding:
  default:
    provider: ollama
    model: bge-m3
    base_url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}   # 用 127.0.0.1 而非 localhost：Windows 上 localhost 解析到 IPv6 ::1，Ollama 只绑 IPv4
    dimensions: 1024

# Reranker (cross-encoder semantic reranking)
reranker:
  provider: flag_embedding
  model: BAAI/bge-reranker-v2-m3
  enabled: false   # 关闭：FlagEmbedding 未安装，开启只会每次查询失败重试白等 ~3s 且 fallback 到中性分（对排序无影响）。装好 FlagEmbedding + 下载模型后可重新开启
  trigger:
    min_soft_requirements: 2
    score_gap_threshold: 0.1
    max_candidates: 50

# Vector DB
vector_db:
  provider: qdrant
  url: ${QDRANT_URL:-http://localhost:16336}
  collection: products

# Redis
redis:
  url: ${REDIS_URL:-redis://localhost:16379}

# Database
database:
  url: ${DATABASE_URL:-postgresql://postgres:password@localhost:5432/shopping_agent}

# Router
router:
  routes:
    search: search_recommend_agent
    compare: detail_compare_agent
    recommend: search_recommend_agent
    detail: detail_compare_agent
  fallback: search_recommend_agent
  semantic_threshold: 0.80

# Multi-Agent configs
agents:
  search_recommend_agent:
    max_iterations: 5
    response_type: recommendation_cards
    tools: [product_search, multi_query_search, ask_clarification, constraint_relaxation, review_summary]
  detail_compare_agent:
    max_iterations: 6
    response_type: comparison_table
    tools: [product_search, product_detail_batch, price_compare, review_summary]

# Session lifecycle
session:
  idle_timeout: 3600          # 1h inactivity → idle
  archive_timeout: 86400      # 24h inactivity → archived (new session on next visit)
  messages_ttl: 86400         # 24h — Redis L2a sliding window, refreshed on each write
  summary_ttl: 604800         # 7d — Redis L2b compressed summary, refreshed on each trim
  tool_result_ttl: 7200       # 2h — large tool result persistence
  dag_ttl: 86400              # 24h — DAG/task state in Redis
  lock_ttl: 30                # 30s — batch classification SETNX lock

# Memory
memory:
  context_window: 8192
  compression_threshold: 0.6
  sliding_window_rounds: 5
  summary_max_words: 200
  recall_top_k: 5
  batch_extract_interval: 3       # trigger batch preference extraction every N turns
  batch_extract_min_gap_sec: 300  # minimum 5 minutes between extractions

# Celery (task queue)
celery:
  broker_url: ${CELERY_BROKER_URL:-amqp://guest:guest@localhost:5672//}
  result_backend: ${CELERY_RESULT_BACKEND:-}

# Auth (JWT) — Python-side config
# NOTE: After Phase 3.5 T4, Python will validate JWT via Java's JWKS endpoint (RS256).
# Until then, Python continues to use HS256 symmetric verification.
auth:
  jwks_url: ${JWKS_URL:-http://localhost:18080/.well-known/jwks.json}  # Java JWKS endpoint (used in P3.5-T4)
  secret_key: ${JWT_SECRET_KEY}
  algorithm: HS256                    # Will change to RS256 in P3.5-T4
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# Microservices Architecture (Phase 3.5+)
services:
  java_api:
    url: ${JAVA_API_URL:-http://localhost:18080}   # Java control plane
    health: /api/health
  python_agent:
    url: ${PYTHON_AGENT_URL:-http://localhost:9000}  # Python agent engine
    health: /api/health
  rabbitmq:
    url: ${CELERY_BROKER_URL:-amqp://guest:guest@localhost:5672//}
    events_queue: events  # Java ↔ Python async communication

# API Gateway (Traefik)
gateway:
  enabled: true
  entrypoint: web            # Traefik entrypoint name
  dashboard_url: http://localhost:8080  # Traefik dashboard (dev)
  rate_limit:                # gateway-level rate limit (coarse-grained)
    average: 500             # requests per second (sustained)
    burst: 1000              # burst capacity

# Rate Limiting (Redis sliding window)
rate_limiting:
  enabled: true
  per_user:
    requests: 60        # max requests per window
    window_seconds: 60  # sliding window size
  per_tenant:
    requests: 300
    window_seconds: 60
  global:
    requests: 1000
    window_seconds: 60
  exempt_paths:         # paths that bypass rate limiting
    - /api/health
    - /api/auth/login
    - /api/auth/register

# LLM Cost Tracking
cost_tracking:
  pricing:
    input_per_1m: 0.15    # $ per 1M input tokens (adjust per model)
    output_per_1m: 0.60   # $ per 1M output tokens
  budget:
    daily_cents: 10000    # $100/day per tenant alert threshold

# Logging
logging:
  level: INFO
  format: json
  file_path: logs/app.jsonl
  rotation: daily
